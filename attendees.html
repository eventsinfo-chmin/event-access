<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Registered Attendees</title>
<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: linear-gradient(135deg,#07111f,#0c1b2e);
  color: #fff;
  font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  display: flex;
  justify-content: center;
  padding: 24px 14px;
}

.container {
  width: 100%;
  max-width: 520px;
}

.header {
  text-align: center;
  margin-bottom: 20px;
}

.header h1 {
  margin: 0;
  font-size: 28px;
  font-weight: 800;
}

.header p {
  color: #9fb1c7;
  margin: 7px 0 0;
}

.card {
  background: #101d2e;
  border: 1px solid rgba(255,255,255,.08);
  border-radius: 20px;
  padding: 18px;
  box-shadow: 0 20px 50px rgba(0,0,0,.30);
}

button {
  border: 0;
  border-radius: 12px;
  padding: 14px;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
}

button:disabled {
  opacity: .45;
  cursor: not-allowed;
}

#attendeeView { display: block; }

.session-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  background: #0b1625;
  padding: 11px 12px;
  border-radius: 12px;
  margin-bottom: 12px;
}

.session-label {
  color: #71869f;
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
}

.session-active {
  color: #56d39b;
  font-size: 13px;
  font-weight: 800;
  margin-top: 3px;
}

#sessionCountdown {
  color: #8fa5bd;
  font-size: 11px;
  margin-top: 3px;
}

#clearAccessButton {
  background: #26364b;
  color: #fff;
  padding: 9px 12px;
  font-size: 11px;
}

.footer {
  text-align: center;
  color: #687c94;
  margin-top: 18px;
  font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  font-size: 12px !important;
  font-weight: 400;
  line-height: 1.2;
}


/* REGISTERED ATTENDEES POST-LOGIN UI */
.attendee-toolbar{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;margin-bottom:12px}
.attendee-field label{display:block;color:#aebed1;font-size:11px;font-weight:800;text-transform:uppercase;margin-bottom:6px}
.attendee-field select{width:100%;border:1px solid rgba(255,255,255,.12);background:#101d2e;color:#fff;border-radius:10px;padding:11px;font-size:14px;outline:none}
.attendee-refresh{align-self:end;background:#26364b;color:#fff}
.attendee-summary{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;color:#8fa5bd;font-size:12px;margin:8px 0}
.attendee-table-wrap{overflow:auto;max-height:62vh;border:1px solid rgba(255,255,255,.08);border-radius:12px;background:#0b1625}
.attendee-table{width:100%;border-collapse:collapse;min-width:560px}
.attendee-table th,.attendee-table td{padding:10px 11px;border-bottom:1px solid rgba(255,255,255,.07);text-align:left;white-space:nowrap;font-size:13px}
.attendee-table th{position:sticky;top:0;z-index:2;background:#17263a;color:#c7d5e5;font-size:11px;text-transform:uppercase}
.attendee-table th:first-child,.attendee-table td:first-child{width:54px;text-align:center}
.attendee-table input[type=checkbox]{width:18px;height:18px;accent-color:#62a7ff}
.attendee-empty{text-align:center!important;color:#71869f;padding:28px!important}
.attendee-loading{padding:12px;border-radius:11px;text-align:center;font-size:13px;background:#42351b;color:#ffe9a6;margin-bottom:12px}
.attendee-error{padding:12px;border-radius:11px;text-align:center;font-size:13px;background:#481e25;color:#ffd7dc;margin-bottom:12px}
.attendee-ok{padding:10px;border-radius:11px;text-align:center;font-size:12px;background:#123a2c;color:#caffea;margin-bottom:12px}
@media(max-width:700px){.attendee-toolbar{grid-template-columns:1fr}.attendee-refresh{width:100%}}

.submit-wrap{display:flex;justify-content:flex-end;margin-top:18px}
.submit-selected{min-width:180px;border:0;border-radius:10px;padding:13px 20px;font-weight:800;cursor:pointer;background:#111;color:#fff}
.submit-selected:disabled{opacity:.45;cursor:not-allowed}
.status-confirmed{font-weight:800}
.attendee-comment{width:190px;min-width:150px;border:1px solid rgba(255,255,255,.12);background:#101d2e;color:#fff;border-radius:8px;padding:8px 9px;font-size:12px;outline:none}
.attendee-comment:focus{border-color:#2e80ff}
.attendee-comment:disabled{opacity:.75;color:#b7c4d5}
</style>

<style>
/* v1.5 attendee filter layout */
.attendee-toolbar{
  display:grid !important;
  grid-template-columns:minmax(0,1fr) minmax(0,1fr) !important;
  gap:12px !important;
  align-items:end !important;
}
.attendee-toolbar .attendee-field{width:100%;min-width:0}
.attendee-toolbar .attendee-refresh{
  grid-column:1 / -1 !important;
  justify-self:start;
  margin-top:0 !important;
}
#groupFilterField[hidden]{display:none !important}
@media (max-width:640px){
  .attendee-toolbar{grid-template-columns:1fr !important}
  .attendee-toolbar .attendee-refresh{grid-column:1 !important}
}
</style>


<style>
/* v1.6 role-aware attendee controls */
.assigned-group-display{
  display:block;
  width:100%;
  margin:4px 0 18px;
  font-size:28px;
  line-height:1.2;
  font-weight:900;
  text-align:left;
  letter-spacing:.2px;
}
.assigned-group-display[hidden]{display:none !important}
@media (max-width:640px){
  .assigned-group-display{font-size:24px}
}
</style>


<style>
#attendeeToolbar[hidden],

</style>


<style>
.refresh-row{
  width:100%;
  margin-top:12px;
  display:flex;
  justify-content:flex-start;
}
.refresh-row .attendee-refresh[hidden]{display:none !important}
</style>


<style>
/* v2.0 status/message: text label only */
#attendeeMessage{
  display:block;
  min-height:20px;
  margin:10px 0 6px;
  padding:0 !important;
  border:0 !important;
  border-radius:0 !important;
  background:transparent !important;
  box-shadow:none !important;
  font-size:13px;
  font-weight:800;
  line-height:1.35;
}
#attendeeMessage:empty{display:none}
#attendeeMessage.success{color:#45d483 !important;background:transparent !important}
#attendeeMessage.error{color:#ff6b75 !important;background:transparent !important}
#attendeeMessage.processing,
#attendeeMessage.info{color:#f1c75b !important;background:transparent !important}
</style>

</head>
<body>
<div class="container">
  <div class="header">
    <h1 id="eventTitle">REGISTERED ATTENDEES</h1>
    <p id="eventSubtitle">Confirmation</p>
  </div>
  <div class="card">
    <div id="attendeeView">
      <div class="session-bar">
        <div>
          <div class="session-label">Registered Attendees Authorization</div>
          <div class="session-active">● AUTHORIZED</div>
          <div id="sessionCountdown">—</div>
        </div>
        <button id="clearAccessButton" onclick="clearAuthorization()">LOGOUT</button>
      </div>

      <div id="assignedGroupDisplay" class="assigned-group-display" hidden></div>
<div class="attendee-toolbar" id="attendeeToolbar">
        <div class="attendee-field">
          <label for="filterMode">Filter Data</label>
          <select id="filterMode" onchange="filterModeChanged()">
            <option value="all">All Data</option>
            <option value="group">By Group Name</option>
          </select>
        </div>
        <div class="attendee-field" id="groupFilterField">
          <label for="groupFilter">Group Name</label>
          <select id="groupFilter" disabled onchange="renderAttendees()">
            <option value="">All Groups</option>
          </select>
        </div>
        </div>
<div class="refresh-row"><button class="attendee-refresh" type="button" onclick="loadAttendees(true)">REFRESH</button></div>

      <div id="attendeeMessage"></div>
      <div class="attendee-summary">
        <span id="attendeeCount">0 registered</span>
        <span id="confirmedCount">0 confirmed</span>
        <span id="selectedCount">0 selected</span>
      </div>

      <div class="attendee-table-wrap">
        <table class="attendee-table">
          <thead id="attendeeHead"></thead>
          <tbody id="attendeeBody"></tbody>
        </table>
      </div>
      <div class="submit-wrap">
        <button id="submitSelectedButton" class="submit-selected" type="button" onclick="submitSelectedAttendees()" disabled>SUBMIT SELECTED</button>
      </div>
    </div>
  </div>
  <div class="footer">Registered Attendees | dmj20 v1.9 | Unified v2.0</div>
</div>

<script>

function syncRoleAwareFilterUI(){
  const toolbar=document.getElementById('attendeeToolbar');
  const groupDisplay=document.getElementById('assignedGroupDisplay');
  const refreshButton=document.querySelector('.attendee-refresh');
  if(!toolbar||!groupDisplay)return;

  const role=String(accessRole||'').trim().toLowerCase();
  const isGroup=(role==='group');

  if(isGroup){
    toolbar.hidden=true;
    toolbar.style.setProperty('display','none','important');
    if(refreshButton){
      refreshButton.hidden=false;
      refreshButton.disabled=false;
      refreshButton.style.removeProperty('display');
    }
    groupDisplay.textContent=String(assignedGroup||'').trim();
    groupDisplay.hidden=false;
  }else{
    toolbar.hidden=false;
    toolbar.style.removeProperty('display');
    if(refreshButton){
      refreshButton.hidden=false;
      refreshButton.disabled=false;
      refreshButton.style.removeProperty('display');
    }
    groupDisplay.textContent='';
    groupDisplay.hidden=true;
    syncGroupFilterVisibility();
  }
}


function syncGroupFilterVisibility(){
  const mode=document.getElementById('filterMode');
  const field=document.getElementById('groupFilterField');
  if(!mode||!field)return;
  field.hidden=(mode.value==='all');
}

let apiUrl = localStorage.getItem('raApiUrl') || '';
let storedScriptId = localStorage.getItem('raScriptId') || '';
let sessionToken = localStorage.getItem('raSession') || '';
let sessionExpiresAt = Number(localStorage.getItem('raExpiresAt') || 0);
let authorizationWindowExpiresAt = Number(localStorage.getItem('raAuthorizationWindowExpiresAt') || 0);
let countdownTimer = null;
let attendeeRows = [];
let attendeeColumns = [];
let groupColumn = 'Group Name';
let accessRole = '';
syncRoleAwareFilterUI();
let assignedGroup = '';
syncRoleAwareFilterUI();
let confirmedKeys = new Set();
let savedRecords = new Map();
let uiConfig = {eventTitle:'REGISTERED ATTENDEES',eventSubtitle:'Event Registration'};



function applyUiConfig(config) {
  config=config||{};
  uiConfig={
    eventTitle:String(config.eventTitle||''),
    eventSubtitle:String(config.eventSubtitle||'')
  };
  document.getElementById('eventTitle').textContent=uiConfig.eventTitle;
  document.getElementById('eventSubtitle').textContent=uiConfig.eventSubtitle;
}
function applyStableAuthorizationExpiry(serverExpiry) {
  serverExpiry=Number(serverExpiry||0);
  if(!serverExpiry)return 0;
  if(authorizationWindowExpiresAt>Date.now()) sessionExpiresAt=Math.min(serverExpiry,authorizationWindowExpiresAt);
  else {authorizationWindowExpiresAt=serverExpiry;sessionExpiresAt=serverExpiry;}
  localStorage.setItem('raAuthorizationWindowExpiresAt',String(authorizationWindowExpiresAt));
  localStorage.setItem('raExpiresAt',String(sessionExpiresAt));
  return sessionExpiresAt;
}
async function postToUrl(url,data) {
  const response=await fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(data),redirect:'follow',cache:'no-store'});
  const text=await response.text();
  if(text){try{const r=JSON.parse(text);if(r&&typeof r==='object'&&typeof r.status==='string')return r;}catch(ignore){}}
  if(!response.ok)throw new Error('Server returned HTTP '+response.status);
  throw new Error('Invalid response from Apps Script.');
}
async function apiRequest(data) {if(!apiUrl)throw new Error('Apps Script URL is not configured.');return postToUrl(apiUrl,data);}









function showAttendeeView() {
  const view = document.getElementById('attendeeView');
  if (view) view.style.display = 'block';
}

function returnToLogin() {
  window.location.replace('index.html');
}
function showAccessScreen() {
  returnToLogin();
}

function startCountdown(){stopCountdown();updateCountdown();countdownTimer=setInterval(updateCountdown,1000);}
function stopCountdown(){if(countdownTimer){clearInterval(countdownTimer);countdownTimer=null;}}
async function updateCountdown(){
  if(!sessionExpiresAt)return;
  const remaining=sessionExpiresAt-Date.now();
  if(remaining<=0){stopCountdown();await authorizationExpired();return;}
  const total=Math.floor(remaining/1000),h=Math.floor(total/3600),m=Math.floor((total%3600)/60),s=total%60;
  let text='Re-authorization in ';if(h>0)text+=h+'h ';text+=String(m).padStart(2,'0')+'m '+String(s).padStart(2,'0')+'s';
  document.getElementById('sessionCountdown').textContent=text;
}

async function authorizationExpired() {
  clearStoredAuthorization();
  returnToLogin();
}

function clearStoredAuthorization(){
  apiUrl='';storedScriptId='';sessionToken='';sessionExpiresAt=0;authorizationWindowExpiresAt=0;stopCountdown();
  ['raApiUrl','raScriptId','raSession','raExpiresAt','raAuthorizationWindowExpiresAt','raAccessRole','raAssignedGroup'].forEach(k=>localStorage.removeItem(k));
  accessRole='';
syncRoleAwareFilterUI();assignedGroup='';
syncRoleAwareFilterUI();
}


async function clearAuthorization() {
  const oldUrl = apiUrl;
  const oldSession = sessionToken;
  clearStoredAuthorization();
  if (oldUrl && oldSession) {
    try { await postToUrl(oldUrl, {action:'logout', session:oldSession}); } catch(ignore) {}
  }
  returnToLogin();
}

function attendeeMessage(type,text){const e=document.getElementById('attendeeMessage');e.className=type?'attendee-'+type:'';e.textContent=text||'';}
let attendeeLoadPromise=null;
async function loadAttendees(forceRefresh=false){
  if(attendeeLoadPromise)return attendeeLoadPromise;
  attendeeLoadPromise=loadAttendeesImpl(forceRefresh);
  try{return await attendeeLoadPromise;}
  finally{attendeeLoadPromise=null;}
}
async function loadAttendeesImpl(showMessage=false){
  if(showMessage)attendeeMessage('loading','Refreshing registered attendees...');
  try{
    const result=await apiRequest({action:'attendees',session:sessionToken,refreshConfig:true});
    if(result.status==='session_expired'){await authorizationExpired();return;}
    if(result.status==='disabled'){attendeeMessage('error',result.message||'Access is disabled.');return;}
    if(!(result.ok===true&&result.status==='success'))throw new Error(result.message||'Unable to load attendees.');
    attendeeRows=Array.isArray(result.rows)?result.rows:[];
    attendeeColumns=Array.isArray(result.columns)?result.columns:[];
    confirmedKeys=new Set(Array.isArray(result.confirmedKeys)?result.confirmedKeys.map(String):[]);
    savedRecords=new Map((Array.isArray(result.savedRecords)?result.savedRecords:[]).map(x=>[String(x.key||''),x]));
    groupColumn=String(result.groupColumn||'Group Name');
    accessRole=String(result.accessRole||accessRole||'');
syncRoleAwareFilterUI();
    assignedGroup=String(result.assignedGroup||assignedGroup||'');
syncRoleAwareFilterUI();
    localStorage.setItem('raAccessRole',accessRole);
    localStorage.setItem('raAssignedGroup',assignedGroup);
    applyUiConfig(result.uiConfig);
    buildGroupOptions();
    applyGroupAccessUi();
    renderAttendees();
    attendeeMessage(showMessage?'ok':'',showMessage?'Data loaded.':'');
  }catch(error){attendeeMessage('error',error.message||'Unable to load attendees.');}
}
function buildGroupOptions(){
  const select=document.getElementById('groupFilter'),old=select.value;
  const groups=[...new Set(attendeeRows.map(r=>String(r[groupColumn]||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
  select.innerHTML='<option value="">All Groups</option>'+groups.map(g=>'<option value="'+escapeHtml(g)+'">'+escapeHtml(g)+'</option>').join('');
  if(accessRole==='group'&&assignedGroup){
    if(!groups.includes(assignedGroup)){
      const o=document.createElement('option');
syncRoleAwareFilterUI();o.value=assignedGroup;o.textContent=assignedGroup;select.appendChild(o);
    }
    select.value=assignedGroup;
  } else if(groups.includes(old)) select.value=old;
}
function applyGroupAccessUi(){
  const mode=document.getElementById('filterMode');
  const group=document.getElementById('groupFilter');
  if(accessRole==='group'){
    mode.value='group';
syncRoleAwareFilterUI();
    mode.disabled=true;
    group.value=assignedGroup;
    group.disabled=true;
  } else {
    mode.disabled=false;
    group.disabled=mode.value!=='group';
  }
}
function filterModeChanged(){syncGroupFilterVisibility();
  if(accessRole==='group'){applyGroupAccessUi();
syncRoleAwareFilterUI();renderAttendees();return;}
  document.getElementById('groupFilter').disabled=document.getElementById('filterMode').value!=='group';
  renderAttendees();
}
function getVisibleRows(){
  if(accessRole==='group'){
    return attendeeRows.filter(r=>String(r[groupColumn]||'')===assignedGroup);
syncRoleAwareFilterUI();
  }
  const mode=document.getElementById('filterMode').value,g=document.getElementById('groupFilter').value;
  return mode==='group'&&g?attendeeRows.filter(r=>String(r[groupColumn]||'')===g):attendeeRows;
}
function attendeeKey(r){
  return attendeeColumns.map(c=>String(r[c]??'').trim()).join('\u001f');
}
function renderAttendees(){
  const data=getVisibleRows(),head=document.getElementById('attendeeHead'),body=document.getElementById('attendeeBody');
  head.innerHTML='<tr><th><input id="selectAllAttendees" type="checkbox" aria-label="Select all" onchange="toggleAllAttendees(this.checked)"></th>'+
    attendeeColumns.map(c=>'<th>'+escapeHtml(c)+'</th>').join('')+
    '<th>Status</th><th>Comment</th></tr>';

  body.innerHTML=data.length?data.map((r,i)=>{
    const key=attendeeKey(r);
    const saved=savedRecords.get(key)||null;
    const confirmed=!!(saved&&String(saved.status||'').toLowerCase()==='confirmed');
    const comment=saved?String(saved.comment||''):'';
    return '<tr>'+
      '<td><input class="attendeeCheck" type="checkbox" data-row="'+i+'" '+(confirmed?'checked disabled':'')+' onchange="syncAllAttendees()"></td>'+
      attendeeColumns.map(c=>'<td>'+escapeHtml(r[c])+'</td>').join('')+
      '<td class="'+(confirmed?'status-confirmed':'')+'">'+(confirmed?'Confirmed':'')+'</td>'+
      '<td><input class="attendee-comment" type="text" data-row="'+i+'" data-original-comment="'+escapeHtmlAttr(comment)+'" value="'+escapeHtmlAttr(comment)+'" placeholder="Type comment" oninput="updateSelectedCount()"></td>'+
      '</tr>';
  }).join(''):'<tr><td class="attendee-empty" colspan="'+Math.max(1,attendeeColumns.length+3)+'">No registered attendees found.</td></tr>';

  document.getElementById('attendeeCount').textContent=data.length+' attendee'+(data.length===1?'':'s')+' displayed';
  const confirmedVisible=data.filter(r=>{
    const saved=savedRecords.get(attendeeKey(r));
    return saved&&String(saved.status||'').toLowerCase()==='confirmed';
  }).length;
  document.getElementById('confirmedCount').textContent=confirmedVisible+' confirmed';
  updateSelectedCount();syncAllAttendees();
}

function toggleAllAttendees(checked){
  document.querySelectorAll('.attendeeCheck:not(:disabled)').forEach(c=>c.checked=checked);
  updateSelectedCount();
}

function syncAllAttendees(){
  const boxes=[...document.querySelectorAll('.attendeeCheck:not(:disabled)')],all=document.getElementById('selectAllAttendees');
  if(all){
    all.disabled=boxes.length===0;
    all.checked=boxes.length>0&&boxes.every(b=>b.checked);
    all.indeterminate=boxes.some(b=>b.checked)&&!all.checked;
  }
  updateSelectedCount();
}

function updateSelectedCount(){
  const selected=document.querySelectorAll('.attendeeCheck:checked:not(:disabled)').length;
  const changedComments=[...document.querySelectorAll('.attendee-comment')].filter(input=>{
    const current=String(input.value||'').trim();
    const original=String(input.dataset.originalComment||'').trim();
    return current!==original;
  }).length;

  document.getElementById('selectedCount').textContent=selected+' selected';

  const btn=document.getElementById('submitSelectedButton');
  if(btn)btn.disabled=(selected===0&&changedComments===0);
}

async function submitSelectedAttendees(){
  const data=getVisibleRows();
  const checks=[...document.querySelectorAll('.attendeeCheck')];
  const comments=[...document.querySelectorAll('.attendee-comment')];

  const checkByRow=new Map(checks.map(box=>[Number(box.dataset.row),box]));
  const commentByRow=new Map(comments.map(input=>[Number(input.dataset.row),input]));
  const rows=[];

  data.forEach((row,index)=>{
    const box=checkByRow.get(index);
    const input=commentByRow.get(index);
    if(!box||!input)return;

    const key=attendeeKey(row);
    const saved=savedRecords.get(key)||null;
    const alreadyConfirmed=!!(saved&&String(saved.status||'').toLowerCase()==='confirmed');

    const currentComment=String(input.value||'').trim();
    const originalComment=String(input.dataset.originalComment||'').trim();
    const commentChanged=currentComment!==originalComment;

    // New confirmation: unchecked/available row is checked.
    // Existing confirmation: checkbox remains locked checked, but changed Comment can still be saved.
    const newConfirmation=!alreadyConfirmed && box.checked===true;

    if(newConfirmation||commentChanged){
      rows.push({
        record:row,
        confirmed:alreadyConfirmed || box.checked===true,
        comment:currentComment
      });
    }
  });

  if(!rows.length){
    attendeeMessage('error','Select an attendee or change a comment.');
    return;
  }

  const btn=document.getElementById('submitSelectedButton');
  btn.disabled=true;
  btn.textContent='SUBMITTING...';
  attendeeMessage('loading','Saving attendee updates...');

  try{
    const result=await apiRequest({action:'confirm',session:sessionToken,rows:rows});
    if(result.status==='session_expired'){await authorizationExpired();return;}
    if(!(result.ok===true&&result.status==='success')){
      throw new Error(result.message||'Unable to save attendee updates.');
    }

    attendeeMessage(
      'ok',
      (result.savedCount||0)+' attendee update'+((result.savedCount||0)===1?'':'s')+' saved.'
    );

    await loadAttendees(false);
  }catch(error){
    attendeeMessage('error',error.message||'Unable to save attendee updates.');
  }finally{
    btn.textContent='SUBMIT SELECTED';
    updateSelectedCount();
  }
}

function escapeHtml(v){return String(v==null?'':v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function escapeHtmlAttr(v){return escapeHtml(v);}

window.addEventListener('DOMContentLoaded',initializePage);
async function initializePage(){
  if(authorizationWindowExpiresAt>0)sessionExpiresAt=authorizationWindowExpiresAt;
  apiUrl=localStorage.getItem('raApiUrl')||apiUrl;storedScriptId=localStorage.getItem('raScriptId')||storedScriptId;sessionToken=localStorage.getItem('raSession')||sessionToken;accessRole=localStorage.getItem('raAccessRole')||'';
syncRoleAwareFilterUI();assignedGroup=localStorage.getItem('raAssignedGroup')||'';
syncRoleAwareFilterUI();
  const expiry=Number(localStorage.getItem('raAuthorizationWindowExpiresAt')||localStorage.getItem('raExpiresAt')||0);
  if(expiry>0){authorizationWindowExpiresAt=expiry;sessionExpiresAt=expiry;}
  if(!apiUrl||!storedScriptId||!sessionToken||!sessionExpiresAt){showAccessScreen();return;}
  if(Date.now()>=sessionExpiresAt){clearStoredAuthorization();showAccessScreen();return;}
  showAttendeeView();startCountdown();
  try{
    const result=await apiRequest({action:'verify',session:sessionToken,refreshConfig:true});
    if(result&&result.status==='session_expired'){await authorizationExpired();return;}
    if(result&&result.status==='disabled'){attendeeMessage('error',result.message||'Access is disabled.');return;}
    if(result&&result.ok===true&&result.status==='authorized'){applyStableAuthorizationExpiry(Number(result.expiresAt||sessionExpiresAt));applyUiConfig(result.uiConfig);accessRole=String(result.accessRole||accessRole||'');
syncRoleAwareFilterUI();assignedGroup=String(result.assignedGroup||assignedGroup||'');
syncRoleAwareFilterUI();await loadAttendees();return;}
    if(sessionExpiresAt>Date.now()){await loadAttendees();return;}
    await authorizationExpired();
  }catch(error){if(sessionExpiresAt>Date.now()){await loadAttendees();return;}await authorizationExpired();}
}

syncGroupFilterVisibility();

syncRoleAwareFilterUI();
</script>
