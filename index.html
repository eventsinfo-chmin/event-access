<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title> | Event Access</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#07111f,#0c1b2e);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;display:flex;justify-content:center;padding:24px 14px}
.container{width:100%;max-width:520px}.header{text-align:center;margin-bottom:20px}.header h1{margin:0;font-size:28px;font-weight:800}.header p{color:#9fb1c7;margin:7px 0 0}
.card{background:#101d2e;border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:18px;box-shadow:0 20px 50px rgba(0,0,0,.30)}
.access-icon{text-align:center;font-size:40px;margin-bottom:10px}.access-title{text-align:center;font-size:22px;font-weight:800;margin-bottom:6px}
.access-subtitle{text-align:center;color:#9fb1c7;font-size:14px;line-height:1.5;margin-bottom:22px}.form-group{margin-bottom:15px}
.form-group label{display:block;color:#aebed1;font-size:13px;font-weight:700;margin-bottom:7px}.form-group input{width:100%;border:1px solid rgba(255,255,255,.12);background:#0b1625;color:#fff;border-radius:12px;padding:14px;font-size:16px;outline:none}
.form-group input:focus{border-color:#2e80ff}.field-help{margin-top:6px;color:#71869f;font-size:11px;line-height:1.5}.token-wrapper{position:relative}.token-wrapper input{padding-right:70px}
.token-toggle{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:#8fa5bd;font-size:12px;font-weight:700;cursor:pointer}
button{border:0;border-radius:12px;padding:14px;font-size:15px;font-weight:700;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}
#authorizeButton{width:100%;background:#2e80ff;color:#fff;margin-top:5px}.access-message{display:none;margin-top:15px;padding:12px;border-radius:11px;text-align:center;font-size:13px}
.access-message.error{display:block;background:#481e25;color:#ffd7dc}.access-message.processing{display:block;background:#42351b;color:#ffe9a6}.access-message.success{display:block;background:#123a2c;color:#caffea}
.route-info{display:none;margin-top:14px;padding:11px;border-radius:11px;background:#0b1625;color:#8fa5bd;text-align:center;font-size:12px}
.footer{text-align:center;color:#687c94;margin-top:18px;font-size:12px;font-weight:400;line-height:1.2}
</style>
<style>
/* Login field labels: left aligned */
#accessForm .form-group {
  width: 100%;
  text-align: left;
}
#accessForm .form-group > label {
  display: block;
  width: 100%;
  text-align: left !important;
  margin-left: 0;
}
</style>


<style id="sharedThemeStyles">
:root{color-scheme:dark} html[data-theme="light"]{color-scheme:light}
html[data-theme="light"] body{background:linear-gradient(135deg,#eef3f8,#fff)!important;color:#172033!important}
html[data-theme="light"] .container{color:#172033}
html[data-theme="light"] .card,html[data-theme="light"] .panel,html[data-theme="light"] .save-mode-panel,
html[data-theme="light"] .queue-panel,html[data-theme="light"] .recent-panel,html[data-theme="light"] #status,
html[data-theme="light"] #resultCard{background:#fff!important;color:#172033!important;border-color:rgba(15,35,60,.14)!important;box-shadow:0 14px 35px rgba(30,55,85,.10)!important}
html[data-theme="light"] .header p,html[data-theme="light"] .access-subtitle,html[data-theme="light"] .field-help,
html[data-theme="light"] .footer,html[data-theme="light"] .route-info{color:#61758d!important}
html[data-theme="light"] label,html[data-theme="light"] .form-group label{color:#50657d!important}
html[data-theme="light"] input,html[data-theme="light"] select,html[data-theme="light"] textarea{background:#f5f8fb!important;color:#172033!important;border-color:rgba(15,35,60,.16)!important}
html[data-theme="light"] .route-info{background:#f4f7fa!important}
html[data-theme="light"] table,html[data-theme="light"] th,html[data-theme="light"] td{color:#172033!important;border-color:rgba(15,35,60,.14)!important}
html[data-theme="light"] th{background:#eef3f8!important}
html[data-theme="light"] tr{background:#fff}
</style>
<script>
(function(){const t=localStorage.getItem('eventTheme')==='light'?'light':'dark';document.documentElement.setAttribute('data-theme',t);})();
</script>

<style id="themeToggleStyles">
.theme-topbar{display:flex;justify-content:flex-end;align-items:center;margin-bottom:10px}
.theme-switch{display:inline-flex;align-items:center;gap:9px;color:#9fb1c7;font-size:12px;font-weight:700;user-select:none}
.theme-switch input{position:absolute;opacity:0;pointer-events:none}
.theme-slider{position:relative;width:46px;height:25px;border-radius:999px;background:#26384e;border:1px solid rgba(255,255,255,.12);cursor:pointer;transition:.2s}
.theme-slider:before{content:"";position:absolute;width:19px;height:19px;left:2px;top:2px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.theme-switch input:checked+.theme-slider{background:#2e80ff}.theme-switch input:checked+.theme-slider:before{transform:translateX(21px)}
html[data-theme="light"] .theme-switch{color:#50657d} html[data-theme="light"] .theme-slider{background:#cbd5e1;border-color:#b6c3d1}
html[data-theme="light"] .theme-switch input:checked+.theme-slider{background:#2e80ff}
</style>

</head><body>
<div class="container"><div class="theme-topbar"><label class="theme-switch"><span id="themeLabel">DARK</span><input id="themeToggle" type="checkbox" aria-label="Toggle light mode"><span class="theme-slider"></span></label></div><div class="header"><h1 id="eventTitle"></h1><p>HINIRANG 2026</p></div>
<div class="card"><div class="access-icon">🔐</div><div class="access-title">AUTHORIZED ACCESS</div>
<div class="access-subtitle">Enter Apps Script deployment ID and Token ID.</div>
<form id="accessForm" onsubmit="authorizeAccess(event)">
<div class="form-group"><label>Script ID</label><input id="scriptId" type="text" placeholder="ENTER SCRIPT_ID" autocomplete="off" required><div class="field-help">Deployment ID, /s/SCRIPT_ID/exec, or complete Apps Script Web App URL.</div></div>
<div class="form-group"><label>Token ID</label><div class="token-wrapper"><input id="accessToken" type="password" placeholder="ENTER TOKEN_ID" autocomplete="off" required><span id="tokenToggle" class="token-toggle" onclick="toggleToken()">SHOW</span></div></div>
<button id="authorizeButton" type="submit">LOGIN</button></form>
<div id="accessMessage" class="access-message"></div><div id="routeInfo" class="route-info"></div></div>
<div class="footer" id="appFooter"></div></div>
<script>
const APP_VERSION='dmj20 v3.1';
document.getElementById('appFooter').textContent='Event Access | '+APP_VERSION;
const ROUTES={scanner:'scanner.html',attendees:'attendees.html'};
function normalizeScriptId(value){value=String(value||'').trim();const m=value.match(/\/s\/([^\/]+)\/exec\/?$/i);if(m&&m[1])return m[1];if(/^[A-Za-z0-9_-]+$/.test(value))return value;throw new Error('Invalid Script ID or Apps Script Web App URL.');}
function buildApiUrlFromId(id){return 'https://script.google.com/macros/s/'+id+'/exec';}
async function postToUrl(url,data){const response=await fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(data),redirect:'follow',cache:'no-store'});const text=await response.text();if(text){try{const result=JSON.parse(text);if(result&&typeof result==='object'&&typeof result.status==='string')return result;}catch(ignore){}}if(!response.ok)throw new Error('Server returned HTTP '+response.status);throw new Error('Invalid response from Apps Script.');}
function detectApplication(result){const explicit=String(result.appType||result.application||'').toLowerCase();if(explicit==='qr_scanner'||explicit==='scanner')return 'scanner';if(explicit==='registered_attendees'||explicit==='attendees')return 'attendees';if(Object.prototype.hasOwnProperty.call(result,'accessRole')||Object.prototype.hasOwnProperty.call(result,'assignedGroup'))return 'attendees';if(Object.prototype.hasOwnProperty.call(result,'qrValidation'))return 'scanner';return '';}
function getServerExpiry(result){if(result.expiresAt)return Number(result.expiresAt);if(result.expiresIn)return Date.now()+Number(result.expiresIn)*1000;return 0;}
function clearScannerStorage(){['hwfApiUrl','hwfScriptId','hwfSession','hwfExpiresAt','hwfAuthorizationWindowExpiresAt'].forEach(k=>localStorage.removeItem(k));}
function clearAttendeeStorage(){['raApiUrl','raScriptId','raSession','raExpiresAt','raAuthorizationWindowExpiresAt','raAccessRole','raAssignedGroup'].forEach(k=>localStorage.removeItem(k));}
function saveScannerSession(apiUrl,scriptId,result){const expiry=getServerExpiry(result);if(!expiry)throw new Error('Scanner server did not return authorization expiration.');clearAttendeeStorage();localStorage.setItem('hwfApiUrl',apiUrl);localStorage.setItem('hwfScriptId',scriptId);localStorage.setItem('hwfSession',String(result.session||''));localStorage.setItem('hwfExpiresAt',String(expiry));localStorage.setItem('hwfAuthorizationWindowExpiresAt',String(expiry));}
function saveAttendeeSession(apiUrl,scriptId,result){const expiry=getServerExpiry(result);if(!expiry)throw new Error('Registered Attendees server did not return authorization expiration.');clearScannerStorage();localStorage.setItem('raApiUrl',apiUrl);localStorage.setItem('raScriptId',scriptId);localStorage.setItem('raSession',String(result.session||''));localStorage.setItem('raExpiresAt',String(expiry));localStorage.setItem('raAuthorizationWindowExpiresAt',String(expiry));localStorage.setItem('raAccessRole',String(result.accessRole||''));localStorage.setItem('raAssignedGroup',String(result.assignedGroup||''));}
async function authorizeAccess(event){event.preventDefault();const scriptInput=document.getElementById('scriptId'),tokenInput=document.getElementById('accessToken'),button=document.getElementById('authorizeButton');const scriptValue=String(scriptInput.value||'').trim(),token=String(tokenInput.value||'').trim();if(!scriptValue||!token){showMessage('error','Enter both Script ID and Token ID.');return;}let scriptId;try{scriptId=normalizeScriptId(scriptValue);}catch(error){showMessage('error',error.message);return;}const apiUrl=buildApiUrlFromId(scriptId);button.disabled=true;showMessage('processing','Validating access and identifying application...');try{const result=await postToUrl(apiUrl,{action:'authorize',scriptId:scriptId,token:token});tokenInput.value='';if(!(result.ok===true&&result.status==='authorized'&&result.session)){showMessage('error',result.message||'Invalid Script ID or Token ID.');return;}let app=detectApplication(result);let merged=result;if(!app){const verify=await postToUrl(apiUrl,{action:'verify',session:String(result.session),refreshConfig:true});app=detectApplication(verify);merged=Object.assign({},result,verify,{session:result.session});}if(!app)throw new Error('Authorized, but the application type could not be identified.');if(app==='scanner')saveScannerSession(apiUrl,scriptId,merged);else saveAttendeeSession(apiUrl,scriptId,merged);routeTo(app);}catch(error){tokenInput.value='';showMessage('error',error.message||'Unable to connect to Apps Script.');}finally{button.disabled=false;}}
function routeTo(app){const info=document.getElementById('routeInfo');info.style.display='block';info.textContent=app==='scanner'?'QR Scanner authorized. Opening scanner...':'Registered Attendees authorized. Opening attendee list...';setTimeout(()=>{window.location.href=ROUTES[app];},250);}
function showMessage(type,message){const e=document.getElementById('accessMessage');e.className='access-message '+type;e.textContent=message;}
function toggleToken(){const input=document.getElementById('accessToken'),toggle=document.getElementById('tokenToggle');if(input.type==='password'){input.type='text';toggle.textContent='HIDE';}else{input.type='password';toggle.textContent='SHOW';}}

function applyEventTheme(theme){
 const t=theme==='light'?'light':'dark';
 document.documentElement.setAttribute('data-theme',t);localStorage.setItem('eventTheme',t);
 const x=document.getElementById('themeToggle'),l=document.getElementById('themeLabel');
 if(x)x.checked=t==='light';if(l)l.textContent=t==='light'?'LIGHT':'DARK';
}
(function(){const t=localStorage.getItem('eventTheme')==='light'?'light':'dark';applyEventTheme(t);
 const x=document.getElementById('themeToggle');if(x)x.addEventListener('change',function(){applyEventTheme(this.checked?'light':'dark');});})();
</script></body></html>
